dependencies {
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    api "net.kyori:adventure-text-minimessage:4.26.1"
    api "org.joml:joml:1.10.5"
    api "org.apache.commons:commons-math3:3.6.1"

    compileOnly "com.bergerkiller.bukkit:TrainCarts:1.20.4-v1-SNAPSHOT"
    compileOnly "com.bergerkiller.bukkit:TCCoasters:1.20.4-v1-SNAPSHOT"

    implementation(platform("com.intellectualsites.bom:bom-newest:1.55")) // Ref: https://github.com/IntellectualSites/bom
    compileOnly "com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.15.0"
    compileOnly "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.15.0"

    compileOnly name: 'openaudiomc-api'
    compileOnly 'com.ticxo.modelengine:ModelEngine:R4.0.4'
    compileOnly 'com.comphenix.protocol:ProtocolLib:4.7.0'
    compileOnly 'me.m56738:easyarmorstands-api:2.6.1'

    shadow "me.m56738:SmoothCoastersAPI:1.11"
    shadow "com.opencsv:opencsv:5.9"
    shadow "com.jeff-media:custom-block-data:2.2.2"
    shadow 'org.jsoup:jsoup:1.17.2'
    shadow 'fr.mrmicky:fastboard:2.1.3'
    shadow 'com.github.patheloper.pathetic:pathetic-mapping:2.3'
    shadow 'gg.flyte:twilight:1.1.12'

    // Dependencies which need to be updated frequently
    shadow 'com.github.retrooper:packetevents-spigot:2.5.0'
    implementation("com.github.Tofaa2:EntityLib:2.4.11")

    implementation "net.dv8tion:JDA:5.0.0-beta.23" // "Shadowed" via plugin libraries in the plugin.yml
    implementation 'org.springframework:spring-expression:6.0.12'
    implementation 'club.minnced:jda-ktx:0.11.0-beta.20'
    implementation 'com.github.M64DiamondStar:EffectMaster:1.4.1'

    paperweight.paperDevBundle "1.21.11-R0.1-SNAPSHOT"
}

group = "me.m64diamondstar"
version = "1.21.11-R0.1-SNAPSHOT"
description = "IngeniaMC-Core"
java.sourceCompatibility = JavaVersion.VERSION_21
//paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.MOJANG_PRODUCTION

java {
    // Configure the java toolchain. This allows gradle to auto-provision JDK 21 on systems that only have JDK 11 installed for example.
    sourceCompatibility = "21"
    targetCompatibility = "21"
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks {
    compileJava {
        options.encoding = StandardCharsets.UTF_8.name() // We want UTF-8 for everything

        // Set the release flag. This configures what version bytecode the compiler will emit, as well as what JDK APIs are usable.
        // See https://openjdk.java.net/jeps/247 for more information.
        options.release.set(21)
    }

    compileKotlin {
        kotlinOptions.jvmTarget = "21"
    }

    javadoc {
        options.encoding = StandardCharsets.UTF_8.name() // We want UTF-8 for everything
    }

    processResources {
        filteringCharset = "UTF-8" // We want UTF-8 for everything
        def props = [
                "name": project.name,
                "version": project.version,
                "description": project.description,
                "apiVersion": "1.21"
        ]
        inputs.properties(props)
        filesMatching("plugin.yml") {
            expand(props)
        }
    }
}

shadowJar {
    // Rename the JAR file if needed
    archiveFileName.set("IngeniaMC-" + project.version + ".jar")

    // Include dependencies in the fat JAR
    configurations = [project.configurations.shadow]

    // Relocate packages
    relocate 'com.jeff_media', 'me.m64diamondstar.ingeniamccore.libs.jeff_media'
    relocate 'me.m56738.SmoothCoastersAPI', 'me.m64diamondstar.ingeniamccore.libs.smoothcoasters'
    relocate 'fr.mrmicky.fastboard', 'me.m64diamondstar.fastboard'
    relocate 'com.github.patheloper.pathetic.pathetic-mapping', 'me.m64diamondstar.ingeniamccore.libs.pathetic'
    relocate 'gg.flyte.twilight', 'me.m64diamondstar.ingeniamccore.libs.twiligt'
    relocate 'com.github.retrooper.packetevents', 'me.m64diamondstar.ingeniamccore.libs.packetevents'
    relocate 'me.tofaa.entitylib', 'me.m64diamondstar.ingeniamccore.libs.entitylib'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}